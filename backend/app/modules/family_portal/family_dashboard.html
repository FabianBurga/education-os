<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Education OS · Familia</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#182134;--muted:#6b7587;--line:#e5e8ee;--accent:#293b57}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 24px;position:sticky;top:0;z-index:3}
.wrap{max-width:1120px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}
h1{font-size:21px;margin:0}.muted{color:var(--muted);font-size:13px}
.auth{display:flex;gap:8px}.auth input{min-width:300px}
input,button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
button{cursor:pointer;font-weight:650}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:26px 24px 60px}.children{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 12px #1b263b08}
.child{cursor:pointer}.child:hover{border-color:#bdc5d2}.name{font-weight:760;font-size:17px}.tiny{font-size:12px;color:var(--muted);margin-top:5px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.metric .v{font-size:25px;font-weight:780;margin-top:6px}
section{margin-top:24px}section h2{font-size:16px;margin:0 0 11px}
.notice{padding:14px 0;border-bottom:1px solid var(--line)}.notice:last-child{border:0}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{font-size:11px;text-transform:uppercase;color:var(--muted)}.empty{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:720px){.head{align-items:flex-start;flex-direction:column}.auth{width:100%;flex-direction:column}.auth input{min-width:0;width:100%}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap head">
<div><h1>Mi Familia</h1><div class="muted" id="guardian">Education OS · Family Portal</div></div>
<div class="auth"><input id="token" type="password" placeholder="Bearer token"><button class="primary" onclick="connect()">Conectar</button></div>
</div></header>
<main class="wrap">
<section><h2>Mis hijos</h2><div id="children" class="children"></div></section>
<section id="overviewSection" style="display:none"><h2 id="studentTitle">Resumen</h2><div id="overview" class="metrics"></div></section>
<section><h2>Avisos</h2><div id="notices" class="card"></div></section>
<section id="attendanceSection" style="display:none"><h2>Asistencia reciente</h2><div class="card"><table><thead><tr><th>Fecha</th><th>Asignatura</th><th>Estado</th><th>Atraso</th></tr></thead><tbody id="attendance"></tbody></table></div></section>
<section id="gradesSection" style="display:none"><h2>Calificaciones</h2><div class="card"><table><thead><tr><th>Asignatura</th><th>Evaluación</th><th>Nota</th><th>Estado</th></tr></thead><tbody id="grades"></tbody></table></div></section>
<div id="status" class="muted" style="margin-top:18px"></div>
</main>
<script>
const base='/api/v1/family-portal', tokenEl=document.getElementById('token');
tokenEl.value=sessionStorage.getItem('education_family_token')||'';
function headers(){return tokenEl.value.trim()?{'Authorization':'Bearer '+tokenEl.value.trim()}:{}}
async function api(path,opts={}){const r=await fetch(base+path,{...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}
function connect(){sessionStorage.setItem('education_family_token',tokenEl.value.trim());load()}
function metric(label,value){return `<div class="card metric"><div class="muted">${label}</div><div class="v">${value??'—'}</div></div>`}
async function load(){
 try{
  const [me,kids,notices]=await Promise.all([api('/me'),api('/children'),api('/notices')]);
  document.getElementById('guardian').textContent=`${me.given_names} ${me.family_names} · ${me.linked_children} estudiante(s)`;
  document.getElementById('children').innerHTML=kids.length?kids.map(k=>`<div class="card child" onclick="selectChild('${k.student_profile_id}','${(k.given_names+' '+k.family_names).replaceAll("'","")}')"><div class="name">${k.given_names} ${k.family_names}</div><div class="tiny">${k.grade_name||'Sin grado'} · ${k.section_name||'Sin paralelo'}</div><div class="tiny">${k.academic_period_name||''}</div></div>`).join(''):'<div class="card empty">No hay estudiantes autorizados.</div>';
  document.getElementById('notices').innerHTML=notices.length?notices.map(n=>`<div class="notice"><strong>${n.title}</strong><div class="tiny">${n.notice_type}</div><p>${n.body}</p>${n.requires_acknowledgement&&!n.acknowledged_at?`<button onclick="ack('${n.id}')">Confirmar lectura</button>`:''}</div>`).join(''):'<div class="empty">No hay avisos publicados.</div>';
  document.getElementById('status').textContent='Portal actualizado.';
 }catch(e){document.getElementById('status').textContent='No se pudo cargar: '+e.message}
}
async function selectChild(id,name){
 try{
  const [o,a,g]=await Promise.all([api(`/children/${id}/overview`),api(`/children/${id}/attendance?limit=20`),api(`/children/${id}/grades`)]);
  document.getElementById('studentTitle').textContent=name;
  document.getElementById('overview').innerHTML=metric('Asistencia',o.attendance_rate===null?'—':o.attendance_rate.toFixed(1)+'%')+metric('Ausencias',o.absence_count)+metric('Atrasos',o.late_count)+metric('Promedio',o.academic_average_percent===null?'—':o.academic_average_percent.toFixed(1)+'%')+metric('Faltantes',o.missing_assessments);
  document.getElementById('attendance').innerHTML=a.map(x=>`<tr><td>${x.session_date}</td><td>${x.subject_name||'—'}</td><td>${x.label}</td><td>${x.minutes_late||0} min</td></tr>`).join('');
  document.getElementById('grades').innerHTML=g.map(x=>`<tr><td>${x.subject_name||'—'}</td><td>${x.title}</td><td>${x.score===null?'—':x.score+' / '+x.max_score}</td><td>${x.status}</td></tr>`).join('');
  document.getElementById('overviewSection').style.display='block';document.getElementById('attendanceSection').style.display='block';document.getElementById('gradesSection').style.display='block';
 }catch(e){document.getElementById('status').textContent='Error: '+e.message}
}
async function ack(id){try{await api(`/notices/${id}/acknowledge`,{method:'POST'});await load()}catch(e){document.getElementById('status').textContent='Error: '+e.message}}
if(tokenEl.value)load();
</script>
</body></html>
