[project]
name = "education-os-backend"
version = "0.1.0"
description = "Education OS M0 â€” Foundation & Tenant Isolation"
requires-python = ">=3.14,<4.0"
dependencies = [
  "fastapi[standard]>=0.141.1,<1.0.0",
  "sqlmodel>=0.0.39,<1.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "alembic>=1.19.1,<2.0.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt>=2.10,<3.0",
  "pwdlib[argon2]>=0.3.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

