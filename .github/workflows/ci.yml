name: education-os-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: education_os
          POSTGRES_USER: education_owner
          POSTGRES_PASSWORD: education_owner_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U education_owner -d education_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      APP_NAME: Education OS
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ci-only-secret
      OWNER_DATABASE_URL: postgresql+psycopg://education_owner:education_owner_dev@localhost:5432/education_os
      DATABASE_URL: postgresql+psycopg://education_app:education_app_dev@localhost:5432/education_os
      OWNER_DATABASE_URL_PG: postgresql://education_owner:education_owner_dev@localhost:5432/education_os
      DATABASE_URL_PG: postgresql://education_app:education_app_dev@localhost:5432/education_os

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create runtime DB role
        run: |
          PGPASSWORD=education_owner_dev psql \
            -h localhost -U education_owner -d education_os \
            -c "CREATE ROLE education_app LOGIN PASSWORD 'education_app_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests tools

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        working-directory: frontend
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
