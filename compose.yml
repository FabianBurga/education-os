services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: education_os
      POSTGRES_USER: education_owner
      POSTGRES_PASSWORD: education_owner_dev
    ports:
      - "5432:5432"
    volumes:
      - education_os_pg:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/001-education-os.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education_owner -d education_os"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  education_os_pg:
